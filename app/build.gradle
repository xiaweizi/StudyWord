plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// v1.5.0:发布签名从 keystore.properties 读取(该文件不入库,已在 .gitignore 中)。
// 文件不存在时**不配置签名**,assembleRelease 仍会产出未签名 APK ——
// 这样 CI / 本地可以只验证 R8 与资源裁剪,不会误产出看似可用实则未签名的包。
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseKeystore = keystorePropsFile.exists()

android {
    namespace 'com.studyword.literacy'
    compileSdk 34

    defaultConfig {
        applicationId "com.studyword.literacy"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "1.7.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                def props = new Properties()
                keystorePropsFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // v1.5.0:打开混淆 + 资源裁剪。
            // 此前 minifyEnabled=false 且 proguard-rules.pro 是空模板(零条生效规则),
            // 现在 proguard-rules.pro 已写入真实 keep 规则(Activity / 自定义 View /
            // TTS 回调 / MPAndroidChart / Kotlin 元数据)。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    androidResources {
        // v1.6.0:内置语音包(assets/audio/*.mp3)必须**不压缩**。
        // 原因:MediaPlayer 播放 assets 需要可 seek 的 AssetFileDescriptor,
        // 而被压缩进 APK 的资源拿不到 —— 会直接播不出声。
        // 另外 ogg/opus 本身已是压缩格式,再压一次几乎不省体积。
        noCompress 'ogg'
        noCompress 'mp3'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'com.github.PhilJay:MPAndroidChart:3.1.0'

    // v1.5.0:显式声明 RecyclerView。
    // 代码里 CharacterLibraryActivity 与两个 Adapter 都直接用 androidx.recyclerview,
    // 但此前只靠 material/appcompat 的传递依赖获得 —— 一次依赖升级就可能静默换版本或丢失。
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Coroutines for async operations
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
